name = "marketplace-ref-bot-relay"
main = "src/worker.js"
compatibility_date = "2024-09-01"

# ID заполнится автоматически после команды:
#   wrangler kv:namespace create AWAITING_KV
# (см. cloudflare-worker/SETUP.md, шаг 3) — впишите полученный id сюда
# вместо ЗАМЕНИТЕ_НА_ID.
[[kv_namespaces]]
binding = "AWAITING_KV"
id = "ЗАМЕНИТЕ_НА_ID"

# Секреты (TELEGRAM_BOT_TOKEN, GITHUB_TOKEN, GITHUB_REPO, ADMIN_USER_IDS)
# сюда НЕ прописываются — они задаются отдельно через
# `wrangler secret put <ИМЯ>`, чтобы не попасть в git.

name: Parse Products
on:
  # schedule:
  #   - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright
          playwright install --with-deps chromium

      - name: Parse marketplaces
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          ALIEXPRESS_AFFILIATE_ID: ${{ secrets.ALIEXPRESS_AFFILIATE_ID }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          GDESLON_AFFILIATE_ID: ${{ secrets.GDESLON_AFFILIATE_ID }}
          GDESLON_WB_CAMPAIGN_ID: ${{ secrets.GDESLON_WB_CAMPAIGN_ID }}
          GDESLON_OZON_CAMPAIGN_ID: ${{ secrets.GDESLON_OZON_CAMPAIGN_ID }}
          GDESLON_YM_CAMPAIGN_ID: ${{ secrets.GDESLON_YM_CAMPAIGN_ID }}
          MIN_DISCOUNT_PERCENT: ${{ vars.MIN_DISCOUNT_PERCENT || '20' }}
          MAX_PRODUCTS_PER_PARSE: ${{ vars.MAX_PRODUCTS_PER_PARSE || '50' }}
        run: python scripts/parse_only.py

      - name: Upload database
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-db
          path: data/marketplace.db
          retention-days: 30
          if-no-files-found: ignore

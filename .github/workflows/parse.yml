name: Parse Products
on:
  schedule:
    # Парсинг каждые 6 часов
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Parse marketplaces
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          WB_AFFILIATE_ID: ${{ secrets.WB_AFFILIATE_ID }}
          OZON_AFFILIATE_ID: ${{ secrets.OZON_AFFILIATE_ID }}
          ALIEXPRESS_AFFILIATE_ID: ${{ secrets.ALIEXPRESS_AFFILIATE_ID }}
          YANDEX_MARKET_AFFILIATE_ID: ${{ secrets.YANDEX_MARKET_AFFILIATE_ID }}
          MIN_DISCOUNT_PERCENT: ${{ vars.MIN_DISCOUNT_PERCENT || '20' }}
          MAX_PRODUCTS_PER_PARSE: ${{ vars.MAX_PRODUCTS_PER_PARSE || '50' }}
        run: python scripts/parse_only.py

      - name: Upload database
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-db
          path: data/marketplace.db
          retention-days: 30
          if-no-files-found: ignore
